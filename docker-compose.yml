services:
  namsventure:
    image: ${DOCKERHUB_USERNAME}/namsventure:latest
    container_name: namsventure
    restart: unless-stopped

    ports:
      - "127.0.0.1:6003:3000"

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
