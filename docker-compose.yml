services:
  namsventure:
    image: ghcr.io/habibieebhy/namsventure:latest
    container_name: namsventure
    restart: unless-stopped

    ports:
      - "127.0.0.1:6003:3000"

    # Settings for the database, admin password etc. Optional until you create .env
    env_file:
      - path: .env
        required: false

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000

    # Lets the container reach Postgres running on this same server.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Alternative: join Supabase's docker network and use supabase-db:5432.
    # Uncomment both blocks below (check the real name with: docker network ls).
    # networks:
    #   - default
    #   - supabase

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# networks:
#   supabase:
#     external: true
#     name: supabase_default
